name: Core canonical clean-wheel matrix

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: core-canonical-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  clean-wheel:
    name: Python ${{ matrix.python }} / Ubuntu 24.04 x64
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python:
          - "3.11.16"
          - "3.12.14"
          - "3.13.15"

    steps:
      - name: Check out the exact tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Install exact Python
        id: setup-python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          architecture: x64
          check-latest: false
          update-environment: false

      - name: Record tested coordinates
        env:
          EXPECTED_PYTHON: ${{ matrix.python }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PYTHON_BIN: ${{ steps.setup-python.outputs.python-path }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${PR_HEAD_SHA:-$GITHUB_SHA}"
          test "$("$PYTHON_BIN" -I -B -c 'import platform; print(platform.python_implementation(), platform.python_version())')" = "CPython $EXPECTED_PYTHON"
          test "$(uname -m)" = "x86_64"
          source /etc/os-release
          test "$ID" = "ubuntu"
          test "$VERSION_ID" = "24.04"
          echo "tested_sha=$(git rev-parse HEAD)"
          echo "github_sha=$GITHUB_SHA"
          echo "pr_head_sha=${PR_HEAD_SHA:-not-a-pull-request}"
          echo "pr_base_sha=${PR_BASE_SHA:-not-a-pull-request}"
          echo "runner_image_os=${ImageOS:-not-reported}"
          echo "runner_image_version=${ImageVersion:-not-reported}"
          uname -a
          cat /etc/os-release
          "$PYTHON_BIN" -I -B -c 'import platform,sys; print(sys.version); print(platform.platform()); print(platform.machine())'

      - name: Check committed LIB-L0 generated view
        env:
          PYTHON_BIN: ${{ steps.setup-python.outputs.python-path }}
          TESTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$TESTED_SHA"
          "$PYTHON_BIN" -I -B \
            "$GITHUB_WORKSPACE/scripts/generate_lib_l0_status_view.py" \
            --source-root "$GITHUB_WORKSPACE" --check

      - name: Build and inspect the direct wheel
        env:
          EXPECTED_PYTHON: ${{ matrix.python }}
          PYTHON_BIN: ${{ steps.setup-python.outputs.python-path }}
          TESTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          project_version="$("$PYTHON_BIN" -I -B - <<'PY'
          import re
          import tomllib
          from pathlib import Path

          value = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]
          if type(value) is not str or re.fullmatch(r"(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)", value) is None:
              raise SystemExit("project version must be a strict numeric final x.y.z")
          print(value)
          PY
          )"
          lock="$GITHUB_WORKSPACE/.github/requirements/core-canonical-python-matrix.txt"
          build_venv="$RUNNER_TEMP/core-build-venv"
          test_venv="$RUNNER_TEMP/core-test-venv"
          wheel_dir="$RUNNER_TEMP/core-direct-wheel"
          neutral="$RUNNER_TEMP/core-neutral"
          "$PYTHON_BIN" -I -B -m venv "$build_venv"
          "$build_venv/bin/python" -I -B -m pip install \
            --isolated --disable-pip-version-check --no-input \
            --require-hashes --only-binary=:all: \
            --index-url https://pypi.org/simple \
            -r "$lock"
          "$build_venv/bin/python" -I -B -m pip check
          mkdir -p "$wheel_dir"
          "$build_venv/bin/python" -I -B -m build \
            --wheel --no-isolation --outdir "$wheel_dir" .
          mapfile -t wheels < <(find "$wheel_dir" -maxdepth 1 -type f -name '*.whl' -print | sort)
          test "${#wheels[@]}" -eq 1
          wheel="${wheels[0]}"
          test "$(basename "$wheel")" = "spirallens-${project_version}-py3-none-any.whl"
          sha256sum "$wheel"

          "$PYTHON_BIN" -I -B -m venv "$test_venv"
          "$test_venv/bin/python" -I -B -m pip install \
            --isolated --disable-pip-version-check --no-input \
            --require-hashes --only-binary=:all: \
            --index-url https://pypi.org/simple \
            -r "$lock"
          "$test_venv/bin/python" -I -B -m pip install \
            --isolated --disable-pip-version-check --no-input \
            --no-index --no-deps --no-compile --force-reinstall "$wheel"
          "$test_venv/bin/python" -I -B -m pip check

          mkdir -p "$neutral/home" "$neutral/pytest-temp"
          expected_test_sha="30d5088bfaf76639208c56b0201589b99a28c7656f382d431ddfb9c8f307ec1f"
          observed_test_sha="$(sha256sum tests/test_core_canonical_compatibility.py | cut -d' ' -f1)"
          test "$observed_test_sha" = "$expected_test_sha"
          contracts_test="tests/test_contracts_library_admission.py"
          expected_contracts_test_sha="f67507db283bfad06d93776f675aa94e76a75f004917665b7919e714175a8929"
          observed_contracts_test_sha="$(sha256sum "$contracts_test" | cut -d' ' -f1)"
          test "$observed_contracts_test_sha" = "$expected_contracts_test_sha"
          source_phantom_tests=()
          while read -r test_sha test_file; do
            test "$(sha256sum "$test_file" | cut -d' ' -f1)" = "$test_sha"
            source_phantom_tests+=("$GITHUB_WORKSPACE/$test_file")
            cp "$test_file" "$neutral/"
          done <<'EOF'
          7b94e888b01f3d5170762b840f65268a2cdccd829cfac9797f72b910c0bbc385 tests/phantoms/test_calibration_suite.py
          a16f76461d90dd33a43236dee47562eb77164dfb729fcab770be27bfe7acc19b tests/phantoms/test_holonomy_phantoms.py
          54aa348ff65da9b00b2433e23e833dcbd0c1a4667924ab1cb241876e4a66e160 tests/phantoms/test_winding_phantoms.py
          EOF
          cp .github/scripts/core_canonical_wheel_probe.py "$neutral/probe.py"
          cp tests/test_core_canonical_compatibility.py "$neutral/test_core_canonical_compatibility.py"
          cp "$contracts_test" "$neutral/test_contracts_library_admission.py"
          site_packages="$("$test_venv/bin/python" -I -B -c 'import site; print(site.getsitepackages()[0])')"

          env -i HOME="$neutral/home" LANG=C.UTF-8 PATH=/usr/bin:/bin \
            PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 \
            SPIRALLENS_EXPECTED_IMPORT_ROOT="$GITHUB_WORKSPACE/src" \
            "$test_venv/bin/python" -I -B -m pytest \
            -c "$GITHUB_WORKSPACE/pyproject.toml" \
            --rootdir "$GITHUB_WORKSPACE" \
            --import-mode=prepend \
            -p no:cacheprovider \
            --basetemp "$RUNNER_TEMP/contracts-source-pytest" \
            "$GITHUB_WORKSPACE/$contracts_test"

          env -i HOME="$neutral/home" LANG=C.UTF-8 PATH=/usr/bin:/bin \
            PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 \
            SPIRALLENS_EXPECTED_IMPORT_ROOT="$GITHUB_WORKSPACE/src" \
            "$test_venv/bin/python" -I -B -m pytest \
            -c "$GITHUB_WORKSPACE/pyproject.toml" --rootdir "$GITHUB_WORKSPACE" \
            --import-mode=importlib -p no:cacheprovider \
            --basetemp "$RUNNER_TEMP/phantoms-source-pytest" \
            "${source_phantom_tests[@]}"

          (
            cd "$neutral"
            env -i HOME="$neutral/home" LANG=C.UTF-8 PATH=/usr/bin:/bin \
              "$test_venv/bin/python" -I -B probe.py \
              --site-packages "$site_packages" \
              --wheel "$wheel" \
              --workspace "$GITHUB_WORKSPACE" \
              --expected-python "$EXPECTED_PYTHON" \
              --expected-version "$project_version" \
              --tested-sha "$TESTED_SHA" \
              --runner-image "${ImageOS:-unknown}/${ImageVersion:-unknown}"
            env -i HOME="$neutral/home" LANG=C.UTF-8 PATH=/usr/bin:/bin \
              PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 \
              "$test_venv/bin/python" -I -B -m pytest \
              -c /dev/null \
              --rootdir "$neutral" \
              --import-mode=importlib \
              -p no:cacheprovider \
              --basetemp "$neutral/pytest-temp" \
              "$neutral/test_core_canonical_compatibility.py"
            env -i HOME="$neutral/home" LANG=C.UTF-8 PATH=/usr/bin:/bin \
              PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 \
              SPIRALLENS_EXPECTED_IMPORT_ROOT="$site_packages" \
              "$test_venv/bin/python" -I -B -m pytest \
              -c /dev/null --rootdir "$neutral" \
              --import-mode=importlib -p no:cacheprovider \
              --basetemp "$neutral/phantoms-pytest-temp" \
              "$neutral/test_calibration_suite.py" \
              "$neutral/test_holonomy_phantoms.py" \
              "$neutral/test_winding_phantoms.py"
            env -i HOME="$neutral/home" LANG=C.UTF-8 PATH=/usr/bin:/bin \
              PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 \
              SPIRALLENS_EXPECTED_IMPORT_ROOT="$site_packages" \
              "$test_venv/bin/python" -I -B -m pytest \
              -c /dev/null \
              --rootdir "$neutral" \
              --import-mode=importlib \
              -p no:cacheprovider \
              --basetemp "$neutral/contracts-pytest-temp" \
              "$neutral/test_contracts_library_admission.py::test_exact_provisional_namespace_surface" \
              "$neutral/test_contracts_library_admission.py::test_representative_value_behavior_is_copied_and_read_only" \
              "$neutral/test_contracts_library_admission.py::test_constructor_failures_and_validation_order" \
              "$neutral/test_contracts_library_admission.py::test_isolated_import_needs_no_model_repository_or_external_action"
          )

      - name: Run the full distribution validator once
        if: ${{ matrix.python == '3.13.15' }}
        env:
          PIP_INDEX_URL: https://pypi.org/simple
          PYTHON_BIN: ${{ steps.setup-python.outputs.python-path }}
          TESTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$TESTED_SHA"
          workspace_status="$(git -C "$GITHUB_WORKSPACE" status --porcelain=v1 --untracked-files=all)"
          test -z "$workspace_status"
          lock="$GITHUB_WORKSPACE/.github/requirements/core-canonical-python-matrix.txt"
          report="$RUNNER_TEMP/full-distribution-validator-v0.10.json"
          test ! -e "$report"
          "$PYTHON_BIN" -I -B -m pip install \
            --isolated --disable-pip-version-check --no-input \
            --force-reinstall --require-hashes --only-binary=:all: \
            --index-url https://pypi.org/simple -r "$lock"
          "$PYTHON_BIN" -I -B -m pip check
          set +e
          "$PYTHON_BIN" -I -B \
            "$GITHUB_WORKSPACE/scripts/validate_distribution.py" \
            --source-root "$GITHUB_WORKSPACE" > "$report"
          validator_status=$?
          set -e
          if (( validator_status != 0 )); then
            if [[ -f "$report" && ! -L "$report" ]] && \
              (( $(wc -c < "$report") <= 2097152 )); then
              cat "$report"
            else
              echo "full distribution validator emitted no bounded regular receipt"
            fi
            exit "$validator_status"
          fi
          "$PYTHON_BIN" -I -B - "$report" "$TESTED_SHA" <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          if path.is_symlink() or not path.is_file():
              raise SystemExit("validator report must be one regular non-symlink file")
          source = path.read_bytes()
          if not 0 < len(source) <= 2 * 1024 * 1024:
              raise SystemExit("validator report size is outside the CI bound")
          report = json.loads(source)
          if (
              type(report) is not dict
              or report.get("schema_version") != "spirallens.distribution-validation.v0.10"
              or report.get("status") != "pass"
              or "error" in report
          ):
              raise SystemExit("validator report identity or status differs")
          canonical = (json.dumps(report, sort_keys=True, separators=(",", ":"), allow_nan=False) + "\n").encode()
          if source != canonical:
              raise SystemExit("validator report is not canonical JSON plus one LF")
          print(json.dumps({"report_bytes": len(source), "report_sha256": hashlib.sha256(source).hexdigest(), "schema_version": report["schema_version"], "status": report["status"], "tested_sha": sys.argv[2]}, sort_keys=True, separators=(",", ":")))
          PY
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$TESTED_SHA"
          workspace_status="$(git -C "$GITHUB_WORKSPACE" status --porcelain=v1 --untracked-files=all)"
          test -z "$workspace_status"
