      - name: Run the full distribution validator once
        if: ${{ matrix.python == '3.13.15' }}
        env:
          PIP_INDEX_URL: https://pypi.org/simple
          PYTHON_BIN: ${{ steps.setup-python.outputs.python-path }}
          TESTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$TESTED_SHA"
          workspace_status="$(git -C "$GITHUB_WORKSPACE" status --porcelain=v1 --untracked-files=all)"
          test -z "$workspace_status"
          lock="$GITHUB_WORKSPACE/.github/requirements/core-canonical-python-matrix.txt"
          report="$RUNNER_TEMP/full-distribution-validator-v0.10.json"
          test ! -e "$report"
          "$PYTHON_BIN" -I -B -m pip install \
            --isolated --disable-pip-version-check --no-input \
            --force-reinstall --require-hashes --only-binary=:all: \
            --index-url https://pypi.org/simple -r "$lock"
          "$PYTHON_BIN" -I -B -m pip check
          set +e
          "$PYTHON_BIN" -I -B \
            "$GITHUB_WORKSPACE/scripts/validate_distribution.py" \
            --source-root "$GITHUB_WORKSPACE" > "$report"
          validator_status=$?
          set -e
          if (( validator_status != 0 )); then
            if [[ -f "$report" && ! -L "$report" ]] && \
              (( $(wc -c < "$report") <= 2097152 )); then
              cat "$report"
            else
              echo "full distribution validator emitted no bounded regular receipt"
            fi
            exit "$validator_status"
          fi
          "$PYTHON_BIN" -I -B - "$report" "$TESTED_SHA" <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          if path.is_symlink() or not path.is_file():
              raise SystemExit("validator report must be one regular non-symlink file")
          source = path.read_bytes()
          if not 0 < len(source) <= 2 * 1024 * 1024:
              raise SystemExit("validator report size is outside the CI bound")
          report = json.loads(source)
          if (
              type(report) is not dict
              or report.get("schema_version") != "spirallens.distribution-validation.v0.10"
              or report.get("status") != "pass"
              or "error" in report
          ):
              raise SystemExit("validator report identity or status differs")
          canonical = (json.dumps(report, sort_keys=True, separators=(",", ":"), allow_nan=False) + "\n").encode()
          if source != canonical:
              raise SystemExit("validator report is not canonical JSON plus one LF")
          print(json.dumps({"report_bytes": len(source), "report_sha256": hashlib.sha256(source).hexdigest(), "schema_version": report["schema_version"], "status": report["status"], "tested_sha": sys.argv[2]}, sort_keys=True, separators=(",", ":")))
          PY
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$TESTED_SHA"
          workspace_status="$(git -C "$GITHUB_WORKSPACE" status --porcelain=v1 --untracked-files=all)"
          test -z "$workspace_status"
